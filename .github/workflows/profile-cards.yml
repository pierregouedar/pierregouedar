name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Colors come from the profile avatar: indigo night, mauve, coral.
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=pierregouedar&show_icons=true&include_all_commits=true&hide=issues,prs,contribs&locale=fr&hide_border=true&rank_icon=github&bg_color=2b2940&title_color=e8908a&text_color=f3e3e1&icon_color=c96462&ring_color=e8908a
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=pierregouedar&layout=compact&langs_count=6&locale=fr&hide_border=true&bg_color=2b2940&title_color=e8908a&text_color=f3e3e1
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pierregouedar&repo=canape&locale=fr&hide_border=true&bg_color=2b2940&title_color=e8908a&text_color=f3e3e1&icon_color=c96462
          path: profile/pin-canape.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pierregouedar&repo=klonk&locale=fr&hide_border=true&bg_color=2b2940&title_color=e8908a&text_color=f3e3e1&icon_color=c96462
          path: profile/pin-klonk.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pierregouedar&repo=learnee&locale=fr&hide_border=true&bg_color=2b2940&title_color=e8908a&text_color=f3e3e1&icon_color=c96462
          path: profile/pin-learnee.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pierregouedar&repo=murmure&locale=fr&hide_border=true&bg_color=2b2940&title_color=e8908a&text_color=f3e3e1&icon_color=c96462
          path: profile/pin-murmure.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pierregouedar&repo=llm-local-stack&locale=fr&hide_border=true&bg_color=2b2940&title_color=e8908a&text_color=f3e3e1&icon_color=c96462
          path: profile/pin-llm-local-stack.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile
          git commit -m "Update profile cards" || exit 0
          git push
