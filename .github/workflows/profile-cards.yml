name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Transparent cards on GitHub's own text colors; the ring takes Canapé's red as the only accent.
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=pierregouedar&show_icons=true&include_all_commits=true&locale=fr&hide_border=true&bg_color=00000000&title_color=e6edf3&text_color=9198a1&icon_color=9198a1&ring_color=e5534b
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=pierregouedar&show_icons=true&include_all_commits=true&locale=fr&hide_border=true&bg_color=00000000&title_color=1f2328&text_color=59636e&icon_color=59636e&ring_color=cf222e
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=pierregouedar&layout=compact&langs_count=6&locale=fr&hide_border=true&bg_color=00000000&title_color=e6edf3&text_color=9198a1
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=pierregouedar&layout=compact&langs_count=6&locale=fr&hide_border=true&bg_color=00000000&title_color=1f2328&text_color=59636e
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile
          git commit -m "Update profile cards" || exit 0
          git push
